name: Build and upload Docker image

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    name: Build Docker image and upload tar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (if secret provided)
        if: secrets.GHCR_PAT != ''
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image with buildx (supports optional GHCR base image)
        env:
          GHCR_IMAGE: ${{ secrets.GHCR_IMAGE }}
        run: |
          cd RunescapeGPT_v1.0.0 || exit 1
          IMAGE_NAME=runescape-gpt-app:latest
          if [ -n "$GHCR_IMAGE" ]; then
            echo "Building using GHCR base image: $GHCR_IMAGE"
            docker build --build-arg BASE_IMAGE="$GHCR_IMAGE" -t $IMAGE_NAME .
          else
            echo "Building using Dockerfile default base image"
            docker build -t $IMAGE_NAME .
          fi

      - name: Save image to tar
        run: |
          mkdir -p out
          IMAGE_NAME=runescape-gpt-app:latest
          docker save $IMAGE_NAME -o out/runescape-gpt-app.tar

      - name: Upload image tar artifact
        uses: actions/upload-artifact@v4
        with:
          name: runescape-gpt-image
          path: out/runescape-gpt-app.tar

      - name: Show instructions
        run: |
          echo "Artifact 'runescape-gpt-image' contains the built image tar."
          echo "Download it from the Actions run -> Artifacts, then load locally with:" 
          echo "  docker load -i runescape-gpt-app.tar"
          echo "Then run:" 
          echo "  docker run -d -p 8000:5000 --name runescape-gpt-container -e OPENAI_API_KEY=\"<KEY>\" runescape-gpt-app"
